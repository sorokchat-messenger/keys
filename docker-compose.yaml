name: sorokchat
services:
  keys:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_CONNECTION_STRING=test
    container_name: sorokchat.keys
    env_file: .env.production.local
    networks:
      - sorokchat
    restart: unless-stopped

networks:
  sorokchat:
    name: sorokchat
  